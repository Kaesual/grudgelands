title = Grudgelands
description = An MMO-inspired voxel RPG: factions, classes, XP, quests, professions and PvP.
author = jan
# The game's version, 0.<round>.<patch> (CHANGELOG.md). The engine reads no
# version key; Help -> About shows this line (grug_inventory/help.lua). The
# upgrade declaration tools/web_data/upgrade.json names the same version
# (tools/check_upgrade.py).
version = 0.44.0
# Combat is core to the game: force damage on, creative off.
disabled_settings = !enable_damage, creative_mode
# The WP40 named-zone pipeline consumes native v7 input and is the sole writer.
allowed_mapgens = v7
default_mapgen = v7
# The world writer accepts only the default mapgen flags and stops the load on
# any other (r7_runtime.lua validate_live_scalars), so the New World dialog
# hides its Caves/Dungeons/Decorations and v7 flag checkboxes. These are the
# only keys that dialog knows besides `seed`, which stays (dlg_create_world.lua);
# it still writes the player's saved flags, and chunksize, water_level and
# mapgen_limit are not in it (the README warns).
disallowed_mapgen_settings = mg_flags, mgv7_spflags
