title = Grudgelands
description = A WoW-inspired voxel RPG: factions, classes, XP, quests, professions and PvP.
author = jan
# Combat is core to the game: force damage on, creative off.
disabled_settings = !enable_damage, creative_mode
# Territory layout (grug_mapgen) relies on biome min_pos/max_pos cuboids.
allowed_mapgens = v7
default_mapgen = v7
