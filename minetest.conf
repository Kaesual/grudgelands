# Grudgelands — game-provided setting defaults.
#
# lua_api.md:194 ("Games"): a `minetest.conf` next to `game.conf` in the game
# directory is "used to set default settings when running this game". It is the
# DEFAULT layer only — the user's own minetest.conf and per-world settings
# still win (lua_api.md:7104-7111 spells out that precedence chain for mapgen
# settings; the same layering applies here). So everything below is a tuned
# starting point a server operator may still override, never a hard guarantee.
# Hard guarantees belong in `game.conf` `disabled_settings` (enable_damage,
# creative_mode) or in code.
#
# Rule for this file: no debug/logging settings ship here (mob_log_spawn,
# mobs_debug and friends stay off), and every line carries its reason.

##
## Mob population (docs/design/biomes_mobs.md §4, "Performance justification")
##

# The global hard cap on simultaneously active mobs, straight out of §4:
# "additionally set mobs_redo mob_active_limit = 600 (global hard cap)".
# mobs_redo counts every activated mob against it (api.lua at_limit/active_mobs)
# and refuses further ABM spawns once it is reached, so this is the backstop
# behind the per-species active_object_count budget: the aoc sums of
# docs/research/wp6_spawn_budget.md bound the density AROUND ONE PLAYER, this
# bounds what 100 dispersed players can add up to server-wide.
mob_active_limit = 600

# Wildlife must despawn when nobody is around — the density budget assumes a
# rolling population, not an accumulating one.
#
# Semantics in mobs_redo (api.lua): with remove_far TRUE, monsters spawn with
# static_save = false and mob_staticdata() deletes any non-npc, non-tamed,
# non-attacking mob whose `lifetimer < 20000` as its block unloads; mob_expire()
# is then skipped entirely (the lifetimer countdown is not needed). With FALSE
# it is the other way round: every mob is written into the world file and only
# the 180 s lifetimer removes it — i.e. visited chunks accumulate saved
# entities that all re-activate when a player comes back. TRUE is the value
# that keeps wildlife despawning, and it is what the roster already assumes:
# grug_mobs/rares.lua sets `lifetimer = 30000` precisely to buy the named rares
# the exemption above, and faction guards are `type = "npc"`, which is exempt
# as well. Camp bandits/mirefolk are meant to be culled — camps.lua respawns
# them from the camp-fire node timer.
#
# It is also the mobs_redo default (`get_bool(...) ~= false`); stated
# explicitly because the whole roster depends on it.
remove_far_mobs = true

##
## Pathfinding (AGENTS.md "Mobs": pathfinding is a QUALITY criterion —
## dangerous mobs must not fail at terrain, or they are not dangerous)
##
## Cost model for all four values: core.find_path only ever runs from
## mob_class:smart_mobs, which is reached only when a mob is in the attack
## state, is further away than its reach, has NO line of sight to its target,
## and has failed to make progress for the timeout below. Ranged families never
## reach it at all (GRUG PATCH in api.lua do_states skips A* for dogshoot).
## Chases are additionally bounded by view_range (<= 16 for ground mobs) and by
## the 40 m leash of combat_stats.md §4.

# Default 16 is the quality ceiling: find_path searches inside the bounding box
# of start/end grown by `searchdistance` in every direction (lua_api.md:7215),
# so 16 gives a mob barely 16 m of lateral detour — not enough to round a
# building, a rock spur or a cliff shoulder, and "no path" means the mob
# reverts to walking into the obstacle. 24 covers the detours that actually
# occur inside a leash radius of 40 m while staying well below the chase
# distances at which the soft de-aggro (25 m, combat_stats §3) takes over
# anyway. Cost: the searched cuboid grows ~(64/48)^3 ~ 2.4x in the worst case
# (A*_noprefetch computes costs lazily, so that is the no-path-exists bound,
# not the typical one). Paid for by the two throttles above it — see
# mob_pathfinding_stuck_timeout / _stuck_path_timeout.
# RUNTIME OBSERVATION PENDING: T10 could not profile this; if the server
# profiler shows find_path in the top entries, drop this to 20 before touching
# any aoc value.
mob_pathfinding_searchdistance = 24

# Default 3.0. A dangerous mob must not rubber-band against a fence for three
# full seconds before it even starts looking for a way round — that is long
# enough for the player to be gone. 2.0 halves the visible hesitation; the
# extra A* calls are bounded by the fact that this timer only advances while
# the mob is moving slower than 0.5 m/s (api.lua smart_mobs), i.e. only while
# genuinely wedged, and by the leash + searchdistance limits above.
mob_pathfinding_stuck_timeout = 2.0

# Default 5.0. Live only because of the GRUG PATCH in api.lua smart_mobs
# (upstream read this setting and never used it): a mob that is ALREADY
# following a computed path gets this longer no-progress patience before the
# path is thrown away and re-planned. 3.0 keeps a wedged path-follower from
# hanging on a bad path much longer than a path-less mob waits (2.0 above),
# while still making re-planning strictly rarer than the short timeout would —
# which is what protects the searchdistance 24 above.
mob_pathfinding_stuck_path_timeout = 3.0

# mob_pathfinding_max_jump is deliberately NOT set (was 1 in T10, removed in
# the WP6 review). It never reaches core.find_path directly; api.lua smart_mobs
# derives the per-mob jump allowance from it:
#     if self.jump_height >= max_jump then
#         jumpheight = min(ceil(self.jump_height / max_jump), max_jump)
#     elseif prop.stepheight > 0.5 then jumpheight = 1 end
# At the DEFAULT of 4 that already yields jumpheight 1 for every def in
# grug_mobs (they all carry jump_height 4: min(ceil(4/4), 4) = 1), and 1 is
# exactly the rise our mobs clear with no jump at all, because they also all
# carry stepheight 1.1. So setting it to 1 changed the outcome for exactly ONE
# def — the Jungle Ape (jump_height 8 -> 2 at the default, clamped to 1 by the
# min() at 1) — i.e. it was a pure regression for the ape and a no-op for
# everyone else. The ape can genuinely take a 2-node step, so it keeps it.
# (mob_pathfinding_max_drop is NOT set either, for a different reason: api.lua
# uses fear_height as the drop allowance whenever it is non-zero, and every
# pathfinding mob in grug_mobs has one — so that setting would be inert.)
